name: SonarQube

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Avoid analyzing superseded commits on the same branch.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze code and test coverage
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~\\sonar\\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install analysis tools
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner
          if ($LASTEXITCODE -ne 0) { throw 'SonarScanner installation failed' }
          dotnet tool install --global dotnet-coverage
          if ($LASTEXITCODE -ne 0) { throw 'Coverage tool installation failed' }

      - name: Build, test and analyze
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet sonarscanner begin /k:"BlueDotBrigade_daten-lokator" /o:"bluedotbrigade" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.qualitygate.wait=false /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml
          if ($LASTEXITCODE -ne 0) { throw 'SonarScanner begin failed' }

          dotnet restore DatenLokator-v2.sln
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }

          dotnet build DatenLokator-v2.sln --configuration Debug --no-restore --no-incremental
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

          # Run unit and functional tests; collect Visual Studio XML coverage for SonarQube.
          dotnet-coverage collect 'dotnet test DatenLokator-v2.sln --configuration Debug --no-build --verbosity normal' -f xml -o coverage.xml
          if ($LASTEXITCODE -ne 0) { throw 'Tests or coverage collection failed' }
          if (-not (Test-Path coverage.xml)) { throw 'Coverage report was not produced' }

          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { throw 'SonarScanner end failed' }
